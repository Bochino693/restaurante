      <stop offset="0" stop-color="#8a3a12"/>
      <stop offset=".55" stop-color="#4a1807"/>
      <stop offset="1" stop-color="#260b03"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3f2fd" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#cfe6f7" stop-opacity=".9"/>
    </linearGradient>
    <clipPath id="dentro">
