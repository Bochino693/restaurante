      <circle cx="58" cy="76" r="1.2" opacity=".5"/>
      <circle cx="73" cy="95" r="2.2" opacity=".45"/>
      <circle cx="81" cy="67" r="1.5" opacity=".55"/>
      <circle cx="45" cy="70" r="1.1" opacity=".5"/>
      <circle cx="67" cy="62" r="1.4" opacity=".45"/>
      <circle cx="85" cy="86" r="1.2" opacity=".5"/>
      <circle cx="55" cy="101" r="1.3" opacity=".45"/>
      <circle cx="78" cy="78" r=".9" opacity=".6"/>
      <circle cx="63" cy="86" r=".9" opacity=".6"/>
    </g>
