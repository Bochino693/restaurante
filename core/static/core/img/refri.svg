    <g fill="#ffffff" fill-opacity=".38" stroke="#ffffff" stroke-opacity=".85" stroke-width="1.3">
      <rect x="38" y="30" width="19" height="19" rx="4" transform="rotate(-12 47.5 39.5)"/>
      <rect x="60" y="33" width="17" height="17" rx="4" transform="rotate(14 68.5 41.5)"/>
