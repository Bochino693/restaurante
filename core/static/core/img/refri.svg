  <line x1="69" y1="100" x2="93" y2="5" stroke="#d6dde5" stroke-width="9" stroke-linecap="round"/>
  <line x1="69" y1="100" x2="93" y2="5" stroke="#ffffff" stroke-width="6.6" stroke-linecap="round"/>
  <line x1="69" y1="100" x2="93" y2="5" stroke="#e3353d" stroke-width="6.6" stroke-dasharray="5.5 5.5"/>

