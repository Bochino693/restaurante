{% if valor is None %}<small class="variacao neutra">sem base para comparar</small>{% elif valor > 0 %}<small class="variacao sobe"><i class="fas fa-arrow-trend-up"></i> +{{ valor }}% vs. período anterior</small>{% elif valor < 0 %}<small class="variacao desce"><i class="fas fa-arrow-trend-down"></i> {{ valor }}% vs. período anterior</small>{% else %}<small class="variacao neutra">= igual ao período anterior</small>{% endif %}
